name: Release chrono-judge-mixed
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release branch
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/tag-check.XXXXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          curl --fail --silent --show-error --location \
            'https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.0-alpha.21/chrono-host-release-linux-x86_64' \
            --output "$directory/chrono-host-release"
          (cd "$directory" && echo '53f966841373df821abf14eb726907ed2c6192bf948e8743fa4952e0818fd5e3  chrono-host-release' | sha256sum --check --status)
          chmod 700 "$directory/chrono-host-release"
          "$directory/chrono-host-release" check-pushed-tag "$GITHUB_REF_NAME"
  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path crates/judge-mixed/Cargo.toml
          binary="$CARGO_TARGET_DIR/release/chrono-judge-mixed"
          tag_version=${GITHUB_REF_NAME#v}
          env PATH= "$binary" --version | grep -Fx "chrono-judge-mixed ${tag_version%%-*}"
          query='{"base":{"workflow":"w","surfaces":{},"semantic_fields":[]},"candidate":{"workflow":"w","surfaces":{},"semantic_fields":[]},"delta":[],"before":{},"after":{}}'
          env PATH= "$binary" classify-v1 <<< "$query" | jq -e '.mixed == false and .rule_paths == [] and .product_paths == []'
          env PATH= "$binary" document-paths-v1 <<< '{"base":[],"candidate":[],"delta":[]}' | jq -e '. == {"base":[],"candidate":[]}'
          mkdir "$RUNNER_TEMP/dist"
          cp "$CARGO_TARGET_DIR/release/chrono-judge-mixed" "$RUNNER_TEMP/dist/chrono-judge-mixed-$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Publish binaries and their checksums
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum chrono-judge-mixed-macos-aarch64 chrono-judge-mixed-linux-x86_64 > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            chrono-judge-mixed-macos-aarch64 chrono-judge-mixed-linux-x86_64 SHA256SUMS
